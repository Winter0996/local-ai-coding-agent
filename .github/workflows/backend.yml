name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # A CI-only throwaway secret — never a real production JWT_SECRET.
          JWT_SECRET: ci-test-secret-not-for-production-use-only-for-pytest
          CODEFORGE_DB_PATH: ":memory:"
        run: pytest

      - name: Run Ruff
        run: ruff check .
